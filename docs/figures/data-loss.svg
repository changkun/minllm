<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img"><title>What a model learns from each version of the text</title><desc>The 14M model, 3,000 steps on each. Loss per token on held-out text: lower is better, and comparable only within a panel.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.f-surface{fill:#fcfcfb}.s-surface{stroke:#fcfcfb}.f-ink{fill:#0b0b0b}.s-ink{stroke:#0b0b0b}.f-ink2{fill:#52514e}.s-ink2{stroke:#52514e}.f-muted{fill:#898781}.s-muted{stroke:#898781}.f-grid{fill:#e1e0d9}.s-grid{stroke:#e1e0d9}.f-axis{fill:#c3c2b7}.s-axis{stroke:#c3c2b7}.f-s1{fill:#2a78d6}.s-s1{stroke:#2a78d6}.f-s2{fill:#eb6834}.s-s2{stroke:#eb6834}.f-s3{fill:#1baf7a}.s-s3{stroke:#1baf7a}@media(prefers-color-scheme:dark){.f-surface{fill:#1a1a19}.s-surface{stroke:#1a1a19}.f-ink{fill:#f0efec}.s-ink{stroke:#f0efec}.f-ink2{fill:#c3c2b7}.s-ink2{stroke:#c3c2b7}.f-muted{fill:#898781}.s-muted{stroke:#898781}.f-grid{fill:#2c2c2a}.s-grid{stroke:#2c2c2a}.f-axis{fill:#383835}.s-axis{stroke:#383835}.f-s1{fill:#3987e5}.s-s1{stroke:#3987e5}.f-s2{fill:#d95926}.s-s2{stroke:#d95926}.f-s3{fill:#199e70}.s-s3{stroke:#199e70}}</style>
<rect class="f-surface s-grid" x="0.5" y="0.5" width="719" height="299" rx="8" stroke-width="1"/>
<text class="f-ink" x="24" y="31" font-size="14" text-anchor="start" font-weight="600">What a model learns from each version of the text</text>
<text class="f-ink2" x="24" y="50" font-size="12" text-anchor="start">The 14M model, 3,000 steps on each. Loss per token on held-out text: lower is better, and comparable only within a panel.</text>
<text class="f-ink" x="64" y="80" font-size="12" text-anchor="start">Trained on</text>
<circle class="f-axis s-surface" cx="148" cy="76" r="4" stroke-width="2"/>
<text class="f-ink2" x="162" y="80" font-size="12" text-anchor="start">raw pages</text>
<circle class="f-s1 s-surface" cx="248.5" cy="76" r="4" stroke-width="2"/>
<text class="f-ink2" x="262.5" y="80" font-size="12" text-anchor="start">text by the rules</text>
<circle class="f-s2 s-surface" cx="402.7" cy="76" r="4" stroke-width="2"/>
<text class="f-ink2" x="416.7" y="80" font-size="12" text-anchor="start">the same without copies</text>
<text class="f-ink" x="64" y="110" font-size="12" text-anchor="start" font-weight="600">Held-out pages as crawled</text>
<text class="f-muted" x="64" y="125" font-size="11" text-anchor="start">menus and all</text>
<line class="s-axis" x1="64" y1="134" x2="64" y2="238" stroke-width="1" stroke-linecap="round"/>
<path class="f-axis" d="M64 142 H137.3 a4 4 0 0 1 4 4 V156 a4 4 0 0 1 -4 4 H64 Z"/>
<text class="f-ink" x="149.3" y="156" font-size="12" text-anchor="start">2.67</text>
<path class="f-s1" d="M64 176 H186.1 a4 4 0 0 1 4 4 V190 a4 4 0 0 1 -4 4 H64 Z"/>
<text class="f-ink" x="198.1" y="190" font-size="12" text-anchor="start">4.37</text>
<path class="f-s2" d="M64 210 H182.4 a4 4 0 0 1 4 4 V224 a4 4 0 0 1 -4 4 H64 Z"/>
<text class="f-ink" x="194.4" y="224" font-size="12" text-anchor="start">4.24</text>
<text class="f-ink" x="284" y="110" font-size="12" text-anchor="start" font-weight="600">Held-out prose</text>
<text class="f-muted" x="284" y="125" font-size="11" text-anchor="start">the same pages, cleaned</text>
<line class="s-axis" x1="284" y1="134" x2="284" y2="238" stroke-width="1" stroke-linecap="round"/>
<path class="f-axis" d="M284 142 H381.8 a4 4 0 0 1 4 4 V156 a4 4 0 0 1 -4 4 H284 Z"/>
<text class="f-ink" x="393.8" y="156" font-size="12" text-anchor="start">3.52</text>
<path class="f-s1" d="M284 176 H375.9 a4 4 0 0 1 4 4 V190 a4 4 0 0 1 -4 4 H284 Z"/>
<text class="f-ink" x="387.9" y="190" font-size="12" text-anchor="start">3.32</text>
<path class="f-s2" d="M284 210 H375.3 a4 4 0 0 1 4 4 V224 a4 4 0 0 1 -4 4 H284 Z"/>
<text class="f-ink" x="387.3" y="224" font-size="12" text-anchor="start">3.30</text>
<text class="f-ink" x="504" y="110" font-size="12" text-anchor="start" font-weight="600">Children&#x27;s stories</text>
<text class="f-muted" x="504" y="125" font-size="11" text-anchor="start">which no model saw</text>
<line class="s-axis" x1="504" y1="134" x2="504" y2="238" stroke-width="1" stroke-linecap="round"/>
<path class="f-axis" d="M504 142 H596.7 a4 4 0 0 1 4 4 V156 a4 4 0 0 1 -4 4 H504 Z"/>
<text class="f-ink" x="608.7" y="156" font-size="12" text-anchor="start">3.35</text>
<path class="f-s1" d="M504 176 H588.4 a4 4 0 0 1 4 4 V190 a4 4 0 0 1 -4 4 H504 Z"/>
<text class="f-ink" x="600.4" y="190" font-size="12" text-anchor="start">3.06</text>
<path class="f-s2" d="M504 210 H587.4 a4 4 0 0 1 4 4 V224 a4 4 0 0 1 -4 4 H504 Z"/>
<text class="f-ink" x="599.4" y="224" font-size="12" text-anchor="start">3.03</text>
<text class="f-muted" x="24" y="280" font-size="11" text-anchor="start">The raw model is best on raw pages, whose menus it has learned. On prose and on stories the cleaned text teaches more.</text>
</svg>
