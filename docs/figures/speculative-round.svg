<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img"><title>One round of speculative decoding</title><desc>The draft guesses four tokens. The model reads them all in one pass, keeps those it agrees with, and adds one of its own.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.f-surface{fill:#fcfcfb}.s-surface{stroke:#fcfcfb}.f-ink{fill:#0b0b0b}.s-ink{stroke:#0b0b0b}.f-ink2{fill:#52514e}.s-ink2{stroke:#52514e}.f-muted{fill:#898781}.s-muted{stroke:#898781}.f-grid{fill:#e1e0d9}.s-grid{stroke:#e1e0d9}.f-axis{fill:#c3c2b7}.s-axis{stroke:#c3c2b7}.f-s1{fill:#2a78d6}.s-s1{stroke:#2a78d6}.f-s2{fill:#eb6834}.s-s2{stroke:#eb6834}.f-s3{fill:#1baf7a}.s-s3{stroke:#1baf7a}@media(prefers-color-scheme:dark){.f-surface{fill:#1a1a19}.s-surface{stroke:#1a1a19}.f-ink{fill:#f0efec}.s-ink{stroke:#f0efec}.f-ink2{fill:#c3c2b7}.s-ink2{stroke:#c3c2b7}.f-muted{fill:#898781}.s-muted{stroke:#898781}.f-grid{fill:#2c2c2a}.s-grid{stroke:#2c2c2a}.f-axis{fill:#383835}.s-axis{stroke:#383835}.f-s1{fill:#3987e5}.s-s1{stroke:#3987e5}.f-s2{fill:#d95926}.s-s2{stroke:#d95926}.f-s3{fill:#199e70}.s-s3{stroke:#199e70}}</style>
<rect class="f-surface s-grid" x="0.5" y="0.5" width="719" height="285" rx="8" stroke-width="1"/>
<text class="f-ink" x="24" y="31" font-size="14" text-anchor="start" font-weight="600">One round of speculative decoding</text>
<text class="f-ink2" x="24" y="50" font-size="12" text-anchor="start">The draft guesses four tokens. The model reads them all in one pass, keeps those it agrees with, and adds one of its own.</text>
<rect class="f-surface s-axis" x="24" y="96" width="168" height="34" rx="6" stroke-width="1"/>
<text class="f-ink" x="36" y="118" font-size="12" text-anchor="start">Natalia sold 48/2 =</text>
<rect class="f-s2 s-s2" x="200" y="96" width="82" height="34" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="241" y="118" font-size="12" text-anchor="middle">24</text>
<rect class="f-s2 s-s2" x="290" y="96" width="82" height="34" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="331" y="118" font-size="12" text-anchor="middle">clips</text>
<rect class="f-s2 s-s2" x="380" y="96" width="82" height="34" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="421" y="118" font-size="12" text-anchor="middle">in</text>
<rect class="f-s2 s-s2" x="470" y="96" width="82" height="34" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="511" y="118" font-size="12" text-anchor="middle">April</text>
<text class="f-ink2" x="566" y="111" font-size="11" text-anchor="start">the draft:</text>
<text class="f-ink2" x="566" y="126" font-size="11" text-anchor="start">4 small passes</text>
<rect class="f-s1 s-s1" x="24" y="158" width="528" height="30" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="36" y="178" font-size="12" text-anchor="start">the model: 1 pass, its next token after each of them</text>
<rect class="f-s1 s-s1" x="200" y="222" width="82" height="34" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="241" y="244" font-size="12" text-anchor="middle">24</text>
<text class="f-ink2" x="241" y="214" font-size="11" text-anchor="middle">kept</text>
<rect class="f-s1 s-s1" x="290" y="222" width="82" height="34" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="331" y="244" font-size="12" text-anchor="middle">clips</text>
<text class="f-ink2" x="331" y="214" font-size="11" text-anchor="middle">kept</text>
<rect class="f-s1 s-s1" x="380" y="222" width="82" height="34" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-ink" x="421" y="244" font-size="12" text-anchor="middle">in</text>
<text class="f-ink2" x="421" y="214" font-size="11" text-anchor="middle">kept</text>
<rect class="f-surface s-s1" x="470" y="222" width="82" height="34" rx="6" stroke-width="2"/>
<text class="f-ink" x="511" y="244" font-size="12" text-anchor="middle" font-weight="600">May</text>
<text class="f-ink2" x="511" y="214" font-size="11" text-anchor="middle">not April: the model&#x27;s</text>
<text class="f-ink2" x="566" y="237" font-size="11" text-anchor="start">3 kept, 1 added:</text>
<text class="f-ink2" x="566" y="252" font-size="11" text-anchor="start">4 tokens for 1 pass</text>
