<path class="f-muted" d="M290 504 H342.1 a4 4 0 0 1 4 4 V516 a4 4 0 0 1 -4 4 H290 Z"/>
<text class="f-ink" x="354.1" y="517" font-size="12" text-anchor="start">13K</text>
