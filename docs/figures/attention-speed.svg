<path class="f-s1" d="M290 400 H409.1 a4 4 0 0 1 4 4 V412 a4 4 0 0 1 -4 4 H290 Z"/>
<text class="f-ink" x="421.1" y="413" font-size="12" text-anchor="start">28K</text>
<text class="f-ink" x="280" y="439" font-size="12" text-anchor="end">Latent, 128 + 32</text>
<path class="f-s2" d="M290 426 H478.1 a4 4 0 0 1 4 4 V438 a4 4 0 0 1 -4 4 H290 Z"/>
<text class="f-ink" x="490.1" y="439" font-size="12" text-anchor="start">44K</text>
<text class="f-ink" x="280" y="465" font-size="12" text-anchor="end">Latent, 64 + 32</text>
<path class="f-s2" d="M290 452 H532.2 a4 4 0 0 1 4 4 V464 a4 4 0 0 1 -4 4 H290 Z"/>
<text class="f-ink" x="544.2" y="465" font-size="12" text-anchor="start">56K</text>
