<text class="f-ink" x="403.3" y="235" font-size="12" text-anchor="start">183</text>
<text class="f-ink" x="280" y="261" font-size="12" text-anchor="end">Latent, 32 + 16</text>
<path class="f-s2" d="M290 248 H393.9 a4 4 0 0 1 4 4 V260 a4 4 0 0 1 -4 4 H290 Z"/>
<text class="f-ink" x="405.9" y="261" font-size="12" text-anchor="start">187</text>
<text class="f-ink" x="280" y="287" font-size="12" text-anchor="end">Latent, 128 + 32, projected up</text>
