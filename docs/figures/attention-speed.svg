<text class="f-ink" x="547.3" y="287" font-size="12" text-anchor="start">433</text>
<text class="f-ink" x="24" y="336" font-size="12" text-anchor="start" font-weight="600">1,024 sequences at once</text>
<line class="s-axis" x1="290" y1="344" x2="290" y2="524" stroke-width="1" stroke-linecap="round"/>
<text class="f-ink" x="280" y="361" font-size="12" text-anchor="end">Multi-head, 6 key/value heads</text>
<path class="f-s1" d="M290 348 H384.5 a4 4 0 0 1 4 4 V360 a4 4 0 0 1 -4 4 H290 Z"/>
<text class="f-ink" x="396.5" y="361" font-size="12" text-anchor="start">22K</text>
<text class="f-ink" x="280" y="387" font-size="12" text-anchor="end">Grouped-query, 2 key/value heads</text>
<path class="f-s1" d="M290 374 H403.6 a4 4 0 0 1 4 4 V386 a4 4 0 0 1 -4 4 H290 Z"/>
<text class="f-ink" x="415.6" y="387" font-size="12" text-anchor="start">27K</text>
