<text class="f-ink2" x="340" y="183" font-size="11" text-anchor="start">expert 4</text>
<text class="f-muted" x="490" y="183" font-size="11" text-anchor="end">not run</text>
<rect class="f-surface s-axis" x="330" y="196" width="170" height="22" rx="4" stroke-width="1"/>
<text class="f-ink2" x="340" y="211" font-size="11" text-anchor="start">expert 5</text>
<text class="f-muted" x="490" y="211" font-size="11" text-anchor="end">not run</text>
<rect class="f-s2" x="330" y="224" width="170" height="22" rx="4" fill-opacity="0.9"/>
<text class="f-surface" x="340" y="239" font-size="11" text-anchor="start">expert 6</text>
<text class="f-surface" x="490" y="239" font-size="11" text-anchor="end">weight 0.3</text>
<path class="s-muted " d="M280 193 L304 193 L304 235 L328 235" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s-muted " d="M321.7 232 L328 235 L321.7 238" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s-muted " d="M500 235 L528 235 L528 193 L552 193" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s-muted " d="M545.7 190 L552 193 L545.7 196" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="f-surface s-axis" x="330" y="252" width="170" height="22" rx="4" stroke-width="1"/>
<text class="f-ink2" x="340" y="267" font-size="11" text-anchor="start">expert 7</text>
<text class="f-muted" x="490" y="267" font-size="11" text-anchor="end">not run</text>
<rect class="f-surface s-axis" x="330" y="280" width="170" height="22" rx="4" stroke-width="1"/>
<text class="f-ink2" x="340" y="295" font-size="11" text-anchor="start">expert 8</text>
<text class="f-muted" x="490" y="295" font-size="11" text-anchor="end">not run</text>
<rect class="f-surface s-axis" x="554" y="165" width="142" height="56" rx="6" stroke-width="1"/>
<text class="f-ink" x="625" y="190" font-size="12" text-anchor="middle" font-weight="600">Weighted sum</text>
<text class="f-ink2" x="625" y="206" font-size="11" text-anchor="middle">0.7 · e3 + 0.3 · e6</text>
<path class="s-muted " d="M625 221 L625 252" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="s-muted " d="M628 245.7 L625 252 L622 245.7" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text class="f-ink2" x="625" y="268" font-size="11" text-anchor="middle">added to the</text>
<text class="f-ink2" x="625" y="283" font-size="11" text-anchor="middle">residual stream</text>
<text class="f-muted" x="24" y="334" font-size="11" text-anchor="start">The block holds the parameters of all eight experts, and a token costs the compute of two.</text>
<text class="f-muted" x="24" y="350" font-size="11" text-anchor="start">Here an expert has half the width of the dense MLP: the same compute per token, and four times the parameters.</text>
</svg>
