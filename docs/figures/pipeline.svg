<rect class="f-s1 s-s1" x="264" y="96" width="98" height="40" rx="6" stroke-width="1" fill-opacity="0.12"/>
<text class="f-muted" x="276" y="121" font-size="11" text-anchor="start">3</text>
<text class="f-ink" x="288" y="121" font-size="12" text-anchor="start" font-weight="600">Pretraining</text>
