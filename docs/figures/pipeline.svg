<rect class="f-surface s-grid" x="0.5" y="0.5" width="719" height="351" rx="8" stroke-width="1"/>
<text class="f-ink" x="24" y="31" font-size="14" text-anchor="start" font-weight="600">The pipeline</text>
<text class="f-ink2" x="24" y="50" font-size="12" text-anchor="start">Ten stages in order, from raw text to a model that other tools run. A side topic branches off the stage it changes.</text>
<text class="f-muted" x="36" y="84" font-size="11" text-anchor="start">From scratch: a 14M model, trained here</text>
