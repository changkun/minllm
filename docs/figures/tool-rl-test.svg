<line class="s-ink" x1="449.3" y1="129" x2="476" y2="129" stroke-width="1.5" stroke-linecap="round"/>
<text class="f-ink" x="484" y="134" font-size="12" text-anchor="start">42.5%</text>
<text class="f-muted" x="523.6" y="134" font-size="11" text-anchor="start">± 2.7%</text>
<text class="f-ink" x="240" y="170" font-size="12" text-anchor="end">fine-tuned with calls (6a)</text>
<path class="f-s1" d="M250 156 H433.3 a4 4 0 0 1 4 4 V170 a4 4 0 0 1 -4 4 H250 Z"/>
<line class="s-ink" x1="424.2" y1="165" x2="450.3" y2="165" stroke-width="1.5" stroke-linecap="round"/>
<text class="f-ink" x="458.3" y="170" font-size="12" text-anchor="start">37.5%</text>
