<text class="f-ink" x="256.5" y="224" font-size="12" text-anchor="start">+1.06</text>
<text class="f-muted" x="170" y="252" font-size="11" text-anchor="start">higher is better</text>
<text class="f-ink" x="356" y="88" font-size="12" text-anchor="start" font-weight="600">Requested words used</text>
