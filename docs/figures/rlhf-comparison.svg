<path class="f-s1" d="M170 176 H266 a4 4 0 0 1 4 4 V190 a4 4 0 0 1 -4 4 H170 Z"/>
<text class="f-ink" x="278" y="190" font-size="12" text-anchor="start">+1.35</text>
