<text class="f-ink" x="24" y="31" font-size="14" text-anchor="start" font-weight="600">What each method did to the stories</text>
<text class="f-ink2" x="24" y="50" font-size="12" text-anchor="start">1,000 sampled stories per model on held-out prompts. Training saw comparisons only, and none of these three measures.</text>
<text class="f-ink" x="170" y="88" font-size="12" text-anchor="start" font-weight="600">The annotator&#x27;s taste</text>
<line class="s-axis" x1="170" y1="100" x2="170" y2="232" stroke-width="1" stroke-linecap="round"/>
<text class="f-ink" x="160" y="122" font-size="12" text-anchor="end">fine-tuned, the start</text>
<path class="f-s1" d="M170 108 H181.4 a4 4 0 0 1 4 4 V122 a4 4 0 0 1 -4 4 H170 Z"/>
<text class="f-ink" x="193.4" y="122" font-size="12" text-anchor="start">+0.21</text>
<text class="f-ink" x="160" y="156" font-size="12" text-anchor="end">PPO</text>
<path class="f-s1" d="M170 142 H260.5 a4 4 0 0 1 4 4 V156 a4 4 0 0 1 -4 4 H170 Z"/>
<text class="f-ink" x="272.5" y="156" font-size="12" text-anchor="start">+1.27</text>
