<text class="f-muted" x="350" y="298" font-size="11" text-anchor="middle">one policy-gradient step: the right replies become likelier</text>
<text class="f-muted" x="24" y="320" font-size="11" text-anchor="start">A group in which every reply earned the same reward has no advantages, and teaches nothing.</text>
