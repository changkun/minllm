<text class="f-ink2" x="550" y="171" font-size="11" text-anchor="start">mean, over its spread</text>
<text class="f-ink2" x="550" y="186" font-size="11" text-anchor="start"></text>
<text class="f-ink" x="550" y="201" font-size="11" text-anchor="start">right:  +1.2</text>
<text class="f-ink" x="550" y="216" font-size="11" text-anchor="start">wrong:  −0.7</text>
<path class="s-muted " d="M617 228 L617 280 L84 280 L84 200" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
