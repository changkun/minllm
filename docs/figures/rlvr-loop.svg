<text class="f-ink" x="24" y="31" font-size="14" text-anchor="start" font-weight="600">One step of GRPO</text>
<text class="f-ink2" x="24" y="50" font-size="12" text-anchor="start">The model answers the same prompt several times, and its answers are compared with each other.</text>
