<path class="s-muted " d="M169.7 167 L176 170 L169.7 173" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text class="f-muted" x="178" y="76" font-size="11" text-anchor="start">8 replies, sampled</text>
<rect class="f-s1" x="178" y="84" width="150" height="18" rx="4" fill-opacity="0.9"/>
<text class="f-surface" x="188" y="97" font-size="11" text-anchor="start">reply 1</text>
<text class="f-surface" x="318" y="97" font-size="11" text-anchor="end">right</text>
