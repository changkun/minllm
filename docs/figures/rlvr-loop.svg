<text class="f-ink" x="433" y="167" font-size="12" text-anchor="middle" font-weight="600">Verifier</text>
<text class="f-ink2" x="433" y="183" font-size="11" text-anchor="middle">a program: 1 or 0</text>
<path class="s-muted " d="M498 170 L536 170" fill="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
