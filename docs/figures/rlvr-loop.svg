<text class="f-ink2" x="188" y="119" font-size="11" text-anchor="start">reply 2</text>
<text class="f-muted" x="318" y="119" font-size="11" text-anchor="end">wrong</text>
<rect class="f-surface s-axis" x="178" y="128" width="150" height="18" rx="4" stroke-width="1"/>
<text class="f-ink2" x="188" y="141" font-size="11" text-anchor="start">reply 3</text>
<text class="f-muted" x="318" y="141" font-size="11" text-anchor="end">wrong</text>
<rect class="f-s1" x="178" y="150" width="150" height="18" rx="4" fill-opacity="0.9"/>
<text class="f-surface" x="188" y="163" font-size="11" text-anchor="start">reply 4</text>
<text class="f-surface" x="318" y="163" font-size="11" text-anchor="end">right</text>
